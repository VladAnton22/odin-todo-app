<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <script src="https://cdn.tailwindcss.com"></script>
<script defer src="main.js"></script></head>

<body class="h-screen font-sans text-gray-800 bg-gray-100">
  <div class="grid grid-cols-[16rem_1fr] grid-rows-[auto_1fr] h-full">
    <!-- Sidebar: Projects -->
    <aside class="row-span-2 bg-white border-r border-gray-200 p-4 overflow-y-auto">

      <form id="project-form" class="mb-4 flex flex-col gap-2">
        <input type="text" name="project" placeholder="New project" required
          class="px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-indigo-200" />
        <button type="submit" class="px-3 py-2 bg-indigo-500 text-white rounded-md hover:bg-indigo-600 transition">
          Add
        </button>
      </form>
      <div class="mt-8 pt-4 border-t-2 border-indigo-500">
        <h2 class="text-xl font-bold mb-4">My Projects</h2>
        <div id="project-list" class="flex flex-col space-y-2">
          <!-- Project buttons go here -->
        </div>
      </div>
    </aside>

    <header class="bg-white border-b border-gray-200 p-4 flex items-center justify-between">
      <h1 id="project-title" class="text-3xl font-bold"></h1>
      <button id="openModal" class="px-3 py-2 bg-indigo-500 text-white rounded-md hover:bg-indigo-600 transition">Add
        Todo</button>
    </header>

    <!-- Main Area: Todos -->
    <main class="p-6 overflow-y-auto">

      <dialog id="todoModal"
        class="rounded-lg shadow-xl p-6 w-full max-w-md border border-gray-300 backdrop:bg-black/50">
        <form id="todoForm" class="flex flex-col gap-4">
          <h2 class="text-xl font-semibold text-gray-800">New Task</h2>

          <div class="flex flex-col">
            <label for="title" class="mb-1 text-sm font-medium text-gray-700">Title</label>
            <input type="text" name="title" id="title" required
              class="px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          </div>

          <div class="flex flex-col">
            <label for="description" class="mb-1 text-sm font-medium text-gray-700">Description</label>
            <textarea name="description" id="description" required rows="3"
              class="px-3 py-2 border rounded-md resize-none focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
          </div>

          <div class="flex flex-col">
            <label for="due-date" class="mb-1 text-sm font-medium text-gray-700">Due Date</label>
            <input type="date" name="due-date" id="due-date"
              class="px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          </div>

          <div class="flex flex-col">
            <label for="priority" class="mb-1 text-sm font-medium text-gray-700">Priority</label>
            <select id="priority" name="priority"
              class="px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="flex justify-end gap-2 mt-4">
            <button type="button" onclick="document.getElementById('todoModal').close()"
              class="px-4 py-2 rounded-md border border-gray-300 text-gray-600 hover:bg-gray-100 transition">
              Cancel
            </button>
            <button type="submit" class="px-4 py-2 rounded-md bg-indigo-500 text-white hover:bg-indigo-600 transition">
              Create Task
            </button>
          </div>
        </form>
      </dialog>


      <ul id="todo-list" class="space-y-2">
        <!-- To-do items go here -->
      </ul>

      <dialog id="editTodoModal" class="rounded-lg shadow-xl p-6 w-full max-w-md border border-gray-300 backdrop:bg-black/50">
        <h2 class="text-xl font-semibold mb-6 text-gray-800">Edit Task</h2>
        <form id="editTodoForm" class="flex flex-col gap-6">
          <input type="text" id="edit-title" name="title" required class="px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <textarea id="edit-description" name="description" required class="px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
          <input type="date" id="edit-due-date" name="due-date" class="px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <select id="edit-priority" name="priority" class="px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
          <div class="flex justify-end gap-2 mt-4">
            <button type="button" onclick="document.getElementById('editTodoModal').close()"
              class="px-4 py-2 rounded-md border border-gray-300 text-gray-600 hover:bg-gray-100 transition">
              Cancel
            </button>
            <button type="submit" class="px-4 py-2 rounded-md bg-indigo-500 text-white hover:bg-indigo-600 transition">
              Save Changes
            </button>
          </div>
        </form>
      </dialog>
    </main>

    <!-- JavaScript entry point -->
    <script type="module" src="./src/index.js"></script>
  </div>
</body>

</html>
